apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl
  template:
    metadata:
      labels:
        app: curl
    spec:
      containers:
      - name: curl
        image: 799016889821.dkr.ecr.ap-northeast-2.amazonaws.com/curl:1.0.1
        command: ["/bin/sleep", "infinity"] 
        imagePullPolicy: IfNotPresent
        #volumeMounts:
        #- name: streamsets-libs
        #  mountPath: /opt/streamsets-datacollector-3.16.2/streamsets-libs
      #volumes:
      #- name: streamsets-libs
      #  persistentVolumeClaim:
      #    claimName: streamsets-libs-pvc
---
